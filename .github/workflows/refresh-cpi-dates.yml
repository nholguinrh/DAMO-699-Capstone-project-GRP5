name: Refresh CPI release dates

on:
  schedule:
    # Runs at 09:00 UTC on the 21st of every month -- after StatCan's
    # mid-month CPI release, so the new month's date is already published.
    - cron: "0 9 21 * *"
  workflow_dispatch: {}  # allows manually triggering from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Compute target-end
        id: target_end
        # Issue #110: this job used to call the script with no arguments, so
        # target_end fell back to a fixed constant that never advanced.
        #
        # StatCan's schedule feed is a *forward* calendar: verified live, it
        # carries scheduled CPI release dates several reference months ahead
        # (e.g. a September fetch already has a scheduled release for the
        # following February). The current month is therefore always already
        # scheduled, and asserting completeness through it is safe. We use
        # the current month rather than a deeper forward horizon so the
        # assertion never depends on how far ahead StatCan happens to
        # publish. (A "last month" back-off was tried and reverted -- besides
        # resting on a mistaken model of the feed, `date -d '1 month ago'`
        # also silently returns the *current* month on a day-29-31 dispatch,
        # since GNU date normalises the calendar overflow instead of
        # clamping it.)
        run: echo "value=$(date -u +%Y-%m-01)" >> "$GITHUB_OUTPUT"

      - name: Run refresh script
        run: python src/build_cpi_release_dates.py --target-end "${{ steps.target_end.outputs.value }}"

      - name: Open PR if the mapping changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh CPI release-date mapping"
          title: "Monthly CPI release-date refresh"
          body: |
            Automated monthly refresh of `config/cpi_release_dates.csv`
            from Statistics Canada's official release calendars, mapped
            through ${{ steps.target_end.outputs.value }}.

            Please review the diff before merging -- this only updates
            reference-month-to-release-date mappings, no pipeline logic.
          branch: auto/refresh-cpi-release-dates
          delete-branch: true